name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum versions, both supported LTS branches, and the versions the first
        # consumer runs.
        include:
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '8.1.*'
            reprise: true
          - php: '8.5'
            symfony: '8.1.*'
            reprise: true
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl
          coverage: none

      # Flex is global, so no recipe modifies the checkout. Without it, composer
      # constrains only the packages named in composer.json, and the transitive
      # Symfony packages resolve to their latest branch, so the run passes without
      # a test of the intended versions.
      - name: Pin the Symfony branch
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - run: composer update --no-progress

      # symfony/reprise needs PHP 8.4 and Symfony 7.4, so in require-dev it would make the
      # lower matrix jobs uninstallable. With it installed here, RepriseHostTest runs and
      # PHPStan reads the fixture kernel against the real class. The matrix jobs without it
      # test the opposite condition: that the skip and the ignored errors still hold.
      - if: matrix.reprise
        run: composer require --dev --no-progress "symfony/reprise:^1.0"

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/phpunit --exclude-group e2e

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl
          coverage: none

      - run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - run: composer cs:check

  panther:
    name: Panther (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.5'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl
          coverage: none

      - name: Pin the Symfony branch
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - run: composer update --no-progress

      - run: vendor/bin/bdi detect drivers

      - run: vendor/bin/phpunit --group e2e --exclude-group playwright
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      # The PHP reader over the tree that the Panther capture trait wrote.
      - name: The PHP reader parses the produced tree
        run: vendor/bin/phpunit --group contract --fail-on-skipped
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panther-failures-php${{ matrix.php }}
          path: |
            tests/Fixtures/app/var/error-screenshots
            ${{ runner.temp }}/shots
          if-no-files-found: ignore

  playwright:
    name: Playwright PHP (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.5'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin the Symfony branch
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - run: composer update --no-progress

      # The bridge installs its npm packages into vendor/, so this runs after each
      # composer update.
      - run: vendor/bin/playwright-install --with-deps --package-manager-bin=npm chromium

      - run: vendor/bin/phpunit --group playwright
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      # The PHP reader over the tree that the playwright-php capture trait wrote.
      - name: The PHP reader parses the produced tree
        run: vendor/bin/phpunit --group contract --fail-on-skipped
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-php-tree-php${{ matrix.php }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  node:
    name: Capture package (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install the bundle that the fixture host serves
        working-directory: .
        run: composer update --no-progress

      - run: npm ci

      - run: npm run build

      # npm `files` cannot reference a path outside the package, so the build copies
      # the shared capture script. Without the copy, the published package cannot
      # capture.
      - name: The shared capture script is in the publishable set
        run: |
          npm pack --dry-run --json | grep -q 'dist/capture/metadata.js'

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - name: Capture against the fixture host
        run: npm run test:integration
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      # The PHP reader over a tree that the npm package wrote. This shows that the
      # layout is a contract and not the behaviour of one implementation.
      - name: The PHP reader parses the produced tree
        working-directory: .
        run: vendor/bin/phpunit --group contract --fail-on-skipped
        env:
          QA_SCREENSHOTS_DIR: ${{ runner.temp }}/shots

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-tree
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  docker:
    name: Review image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qa-review
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/review/Dockerfile
          load: true
          tags: qa-review:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It serves the empty state with an empty tree
        run: |
          mkdir -p "${{ runner.temp }}/empty"
          docker run -d --name review -p 127.0.0.1:8000:8000 \
            -v "${{ runner.temp }}/empty:/data/var/screenshots" qa-review:ci
          curl --retry 20 --retry-delay 2 --retry-all-errors -fsS \
            http://127.0.0.1:8000/_dev/screenshots | grep -F 'No screenshots yet'

      - if: failure()
        run: docker logs review

      # Fork pull requests never reach this: they are not push events and have no
      # write token.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/review/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

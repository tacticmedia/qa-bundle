# Reviewing without a PHP toolchain on the host. Capture still runs outside the
# container: browsers live on the host, and Playwright manages its own.
services:
  review:
    image: ghcr.io/tacticmedia/qa-review:latest
    # Drop this to always take the published image. `docker compose up --build review`
    # builds from this checkout instead, which is what to do while working on the bundle.
    build:
      context: ..
      dockerfile: docker/review/Dockerfile
    # The page has no authentication. Publish it on the LAN only if you mean to.
    ports:
      - "127.0.0.1:8000:8000"
    # /data is the project root as the container sees it, so each tree is mounted
    # at the path it has here. That is what makes the agent brief print paths this
    # checkout can open.
    volumes:
      - ./var/screenshots:/data/var/screenshots
      - ./var/review:/data/var/review
    # On Linux the container writes notes as uid 1000. Uncomment to own them yourself.
    # user: "${UID:-1000}:${GID:-1000}"
